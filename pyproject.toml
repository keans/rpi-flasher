[project]
name = "rpi-flasher"
version = "0.1.0"
description = "A keyboard-driven macOS TUI for flashing Raspberry Pi OS images"
readme = "README.md"
authors = [
    { name = "Ansgar Kellner", email = "keans@gmx.de" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "textual>=8.2.8",
]

[project.scripts]
rpi-flasher = "rpi_flasher.app:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
